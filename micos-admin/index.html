<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mico's Bike Shop — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen" class="hidden">
    <div class="login-bg">
      <div class="login-card">
        <div class="login-brand">
         <span class="brand-icon">
          <img src="assets/logo.jpg" style="width:72px;height:72px;object-fit:cover;border-radius:16px" />
        </span>
          <div>
            <h1>MICO'S</h1>
            <p>Bike Shop Admin</p>
          </div>
        </div>
        <form id="login-form">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="login-username" placeholder="admin" autocomplete="username" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
          </div>
          <div id="login-error" class="alert alert-error hidden"></div>
          <button type="submit" class="btn btn-primary btn-full" id="login-btn">
            Sign In
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app-shell" class="hidden">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-brand">
       <span class="brand-icon">
         <img src="assets/logo.jpg" style="width:72px;height:72px;object-fit:cover;border-radius:20px" />
       </span>
        <span class="brand-text">MICO'S BIKESHOP<em>Admin</em></span>
      </div>

     <nav class="sidebar-nav">
  <a href="#/dashboard" class="nav-item" data-page="dashboard" title="Dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/>
      <rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
    </svg>
    <span>Dashboard</span>
  </a>

  <a href="#/orders" class="nav-item" data-page="orders" title="Orders">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
      <path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>
    </svg>
    <span>Orders</span>
  </a>

  <a href="#/inventory" class="nav-item" data-page="inventory" title="Inventory">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
      <path d="M3.27 6.96 12 12l8.73-5.04"/><path d="M12 22V12"/>
    </svg>
    <span>Inventory</span>
  </a>

  <a href="#/catalog" class="nav-item" data-page="catalog" title="Catalog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/>
      <path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" fill="currentColor"/>
      <path d="m9 17.5 3-9 4 9M5.5 17.5h13M9 8.5h6"/>
    </svg>
    <span>Catalog</span>
  </a>

  <a href="#/customers" class="nav-item" data-page="customers" title="Customers">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </svg>
    <span>Customers</span>
  </a>

  <a href="#/analytics" class="nav-item" data-page="analytics" title="Analytics">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M3 3v18h18"/><path d="m18.7 8-5.1 5.2-3-3L7 14"/>
    </svg>
    <span>Analytics</span>
  </a>

  <a href="#/messages" class="nav-item" data-page="messages" title="Messages">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/>
    </svg>
    <span>Messages</span>
    <span class="nav-badge" id="nav-msg-badge" style="display:none">0</span>
  </a>

  <a href="#/notifications" class="nav-item" data-page="notifications" title="Notifications">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
      <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
    </svg>
    <span>Notifications</span>
    <span class="nav-badge" id="nav-notif-badge" style="display:none">0</span>
  </a>

  <a href="#/settings" class="nav-item" data-page="settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
    </svg>
    <span>Settings</span>
  </a>
</nav>

      <div class="sidebar-footer">
        <div class="admin-chip">
          <span class="admin-avatar" id="admin-initials">A</span>
          <span id="admin-name">Admin</span>
        </div>
        <button id="logout-btn" class="btn-icon" title="Logout">
          <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main id="main-content">
      <div id="page-container"></div>
    </main>
  </div>

  <!-- Global Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="btn-icon" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container"></div>

  <!-- Scripts (load order matters) -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/pages/dashboard.js"></script>
  <script src="assets/js/pages/catalog.js"></script>
  <script src="assets/js/pages/orders.js"></script>
  <script src="assets/js/pages/inventory.js"></script>
  <script src="assets/js/pages/messages.js"></script>
  <script src="assets/js/pages/customers.js"></script>
  <script src="assets/js/pages/shop.js"></script>
  <script src="assets/js/pages/analytics.js"></script>
  <script src="assets/js/pages/notifications.js"></script>
  <script src="assets/js/pages/_placeholders.js"></script>
  <script src="assets/js/router.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
